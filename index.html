<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Cube</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            color: white;
            min-width: 250px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        #controls h2 {
            margin: 0 0 20px 0;
            color: #4ecdc4;
            font-size: 20px;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .color-btn {
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        .color-btn:hover {
            transform: scale(1.05);
        }

        .color-btn.active {
            border-color: white;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .control-group input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .control-group input[type="range"] {
            width: 100%;
            margin-top: 8px;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        #info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h2>🎮 Controls</h2>
            
            <div class="control-group">
                <h3 style="margin: 0 0 10px 0; font-size: 16px;">Cube Color:</h3>
                <div class="color-grid" id="colorButtons"></div>
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="autoRotate" checked>
                    Auto Rotate
                </label>
            </div>

            <div class="control-group" id="speedControl">
                <label>
                    Speed: <span id="speedValue">10</span>
                </label>
                <input type="range" id="speedSlider" min="1" max="50" value="10">
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="showParticles" checked>
                    Show Particles
                </label>
            </div>

            <div class="instructions">
                <strong>💡 How to interact:</strong><br>
                • Drag to rotate the view<br>
                • Scroll to zoom in/out<br>
                • Use controls to customize<br>
                • Click colors to change cube
            </div>
        </div>

        <div id="info">
            <div>🎯 <strong>Current Color:</strong> <span id="currentColor">Red</span></div>
            <div>🔄 <strong>Rotating:</strong> <span id="rotateStatus">Yes</span></div>
            <div>✨ <strong>Particles:</strong> <span id="particleStatus">On</span></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        document.getElementById('container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xffffff, 1, 100);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x4ecdc4, 0.5, 100);
        pointLight2.position.set(-10, -10, -10);
        scene.add(pointLight2);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Create cube
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xff6b6b,
            metalness: 0.3,
            roughness: 0.4
        });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Create particles
        const particles = new THREE.Group();
        const particleGeometry = new THREE.SphereGeometry(0.05, 8, 8);
        
        for (let i = 0; i < 50; i++) {
            const particleMaterial = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(i * 0.02, 0.7, 0.6),
                transparent: true,
                opacity: 0.6
            });
            
            const particle = new THREE.Mesh(particleGeometry, particleMaterial);
            particle.position.set(
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 20
            );
            particles.add(particle);
        }
        scene.add(particles);

        // Camera position
        camera.position.z = 6;

        // Colors
        const colors = [
            { name: 'Red', value: 0xff6b6b },
            { name: 'Blue', value: 0x4ecdc4 },
            { name: 'Green', value: 0x45b7d1 },
            { name: 'Purple', value: 0x96ceb4 },
            { name: 'Orange', value: 0xfeca57 },
            { name: 'Pink', value: 0xff9ff3 }
        ];

        // Create color buttons
        const colorButtonsContainer = document.getElementById('colorButtons');
        let currentColorName = 'Red';

        colors.forEach((color, index) => {
            const button = document.createElement('button');
            button.className = 'color-btn';
            button.style.backgroundColor = `#${color.value.toString(16).padStart(6, '0')}`;
            button.textContent = color.name;
            button.onclick = () => {
                cube.material.color.setHex(color.value);
                currentColorName = color.name;
                document.getElementById('currentColor').textContent = color.name;
                
                // Update active button
                document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            };
            
            if (index === 0) button.classList.add('active');
            colorButtonsContainer.appendChild(button);
        });

        // Controls
        let autoRotate = true;
        let rotationSpeed = 0.01;
        let showParticles = true;
        let mouseX = 0;
        let mouseY = 0;
        let isMouseDown = false;

        // Control event listeners
        document.getElementById('autoRotate').addEventListener('change', (e) => {
            autoRotate = e.target.checked;
            document.getElementById('rotateStatus').textContent = autoRotate ? 'Yes' : 'No';
        });

        document.getElementById('speedSlider').addEventListener('input', (e) => {
            rotationSpeed = e.target.value * 0.001;
            document.getElementById('speedValue').textContent = e.target.value;
        });

        document.getElementById('showParticles').addEventListener('change', (e) => {
            showParticles = e.target.checked;
            particles.visible = showParticles;
            document.getElementById('particleStatus').textContent = showParticles ? 'On' : 'Off';
        });

        // Mouse controls
        let targetRotationX = 0;
        let targetRotationY = 0;

        document.addEventListener('mousedown', (e) => {
            isMouseDown = true;
        });

        document.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                targetRotationY += (e.clientX - mouseX) * 0.005;
                targetRotationX += (e.clientY - mouseY) * 0.005;
            }
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Mouse wheel zoom
        document.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(2, Math.min(15, camera.position.z));
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Auto rotation
            if (autoRotate) {
                cube.rotation.x += rotationSpeed;
                cube.rotation.y += rotationSpeed * 0.7;
            }

            // Mouse rotation
            cube.rotation.x += (targetRotationX - cube.rotation.x) * 0.1;
            cube.rotation.y += (targetRotationY - cube.rotation.y) * 0.1;

            // Animate particles
            if (showParticles) {
                particles.rotation.y += 0.001;
                particles.children.forEach((particle, i) => {
                    particle.position.y += Math.sin(Date.now() * 0.001 + i) * 0.002;
                });
            }

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
